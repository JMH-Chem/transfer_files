name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Linux 에서 Qt 실행에 필요한 라이브러리와 한글 글꼴
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 fonts-nanum
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build-windows:
    name: Windows 실행 파일 만들기
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: PyInstaller
        working-directory: packaging
        run: pyinstaller fileconv.spec --noconfirm --clean --distpath ../dist --workpath ../build
      - name: 실행 파일로 실제 변환해 보기 (ffmpeg·PDF·한글 글꼴이 잘 묶였는지)
        shell: pwsh
        run: |
          $fconv = "dist\FileConverter\fconv.exe"
          mkdir smoke | Out-Null
          python -c "from PIL import Image; Image.new('RGB',(64,64),'red').save('smoke/사진.png')"
          python -c "import pathlib; pathlib.Path('smoke/메모.md').write_text('# 한글 제목\n\n본문', encoding='utf-8')"
          python -c "import imageio_ffmpeg, subprocess; subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-loglevel', 'error', '-f', 'lavfi', '-i', 'sine=d=1', '-f', 'lavfi', '-i', 'testsrc=d=1', '-shortest', 'smoke/영상.mp4'], check=True)"
          & $fconv list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fconv convert smoke\사진.png -t pdf
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fconv convert smoke\메모.md -t pdf
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fconv convert smoke\영상.mp4 -t mp3
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $fconv convert smoke\사진.pdf -t png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem smoke
      - uses: actions/upload-artifact@v4
        with:
          name: FileConverter-windows
          path: dist/FileConverter
